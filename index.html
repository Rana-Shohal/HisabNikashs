<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A41">
<title>লেনদেন খাতা</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F1E1;
    --paper-line:#E4D9BC;
    --ink:#1B2A41;
    --ink-soft:#4B5B72;
    --teal:#2F6F62;
    --rust:#B5482D;
    --gold:#C9A227;
    --card:#FFFDF6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Hind Siliguri', sans-serif;
    background:
      repeating-linear-gradient(var(--paper) 0 31px, var(--paper-line) 31px 32px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:100px;
  }
  header{
    padding:28px 20px 18px;
    text-align:center;
    border-bottom:3px double var(--ink);
    background:var(--paper);
  }
  header h1{
    font-family:'Tiro Bangla', serif;
    font-size:1.9rem;
    margin:0 0 4px;
    letter-spacing:.5px;
  }
  header p{margin:0;color:var(--ink-soft);font-size:.85rem;}
  #status-bar{
    max-width:520px;margin:14px auto 0;padding:0 16px;
    display:flex;justify-content:center;gap:10px;font-size:.8rem;
  }
  .pill{
    padding:4px 12px;border-radius:20px;font-weight:600;
    border:1px solid var(--ink);
  }
  .pill.online{background:var(--teal);color:#fff;border-color:var(--teal);}
  .pill.offline{background:var(--rust);color:#fff;border-color:var(--rust);}
  .pill.pending{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  button.pill.refresh{background:transparent;color:var(--ink);font-family:inherit;font-size:.8rem;cursor:pointer;}

  main{max-width:520px;margin:20px auto;padding:0 16px;}

  .card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:10px;
    box-shadow:0 2px 10px rgba(27,42,65,.08);
    padding:20px;
    margin-bottom:18px;
  }
  .card h2{
    font-family:'Tiro Bangla', serif;
    font-size:1.1rem;
    margin:0 0 16px;
    color:var(--ink);
    border-left:4px solid var(--gold);
    padding-left:10px;
  }
  label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px;color:var(--ink-soft);}
  #balanceBar{
    max-width:520px;margin:12px auto 0;padding:0 16px;text-align:center;
    font-size:.95rem;font-weight:600;color:var(--ink-soft);
  }
  #balanceBar b{font-size:1.15rem;color:var(--teal);}
  #balanceBar b.neg{color:var(--rust);}

  .filter-box{
    margin:0 0 12px;padding:10px 12px;background:#FBF6E8;
    border:1px dashed var(--gold);border-radius:8px;
  }
  .filter-box label{margin:0 0 4px;font-size:.75rem;}
  .filter-box input[type=date]{padding:8px 10px;font-size:.9rem;}
  .filter-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;}
  .filter-summary{font-size:.75rem;color:var(--ink-soft);}
  button.clear-filter{
    border:1px solid var(--ink-soft);background:transparent;color:var(--ink);
    border-radius:6px;padding:5px 12px;font-size:.78rem;font-family:inherit;cursor:pointer;
  }

  #voiceFab{
    position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
    background:var(--ink);color:#fff;font-size:1.6rem;line-height:1;
    box-shadow:0 4px 14px rgba(27,42,65,.35);z-index:40;
    display:flex;align-items:center;justify-content:center;
  }
  #voiceFab.listening{background:var(--rust);animation:pulse 1.1s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(181,72,45,.55);}
    100%{box-shadow:0 0 0 18px rgba(181,72,45,0);}
  }
  #voiceBubble{
    position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom, 0px));
    max-width:min(300px, calc(100vw - 32px));
    background:var(--card);border:1.5px solid var(--ink);border-radius:10px;
    padding:10px 12px;font-size:.85rem;box-shadow:0 4px 14px rgba(27,42,65,.2);
    z-index:40;display:none;
  }
  #voiceBubble.show{display:block;}

  select, input[type=text], input[type=tel], input[type=number], input[type=date], textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--paper-line);
    border-radius:7px;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink);
  }
  select:focus, input:focus, textarea:focus{outline:2px solid var(--teal);border-color:var(--teal);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .hint{font-size:.75rem;color:var(--ink-soft);margin-top:4px;}
  .hint.found{color:var(--teal);font-weight:600;}
  .req::after{content:' *';color:var(--rust);}

  .sms-box{
    margin-top:16px;padding:12px;background:#FBF6E8;border:1px dashed var(--gold);
    border-radius:7px;display:flex;align-items:flex-start;gap:10px;
  }
  .sms-box input{width:auto;margin-top:3px;}
  .sms-box label{margin:0;font-weight:500;color:var(--ink);}

  button.submit{
    width:100%;margin-top:20px;padding:14px;border:none;border-radius:8px;
    background:var(--ink);color:#fff;font-size:1.05rem;font-weight:700;
    font-family:'Hind Siliguri',sans-serif;cursor:pointer;
  }
  button.submit:active{transform:scale(.99);}

  .entries h2{margin-bottom:10px;}
  .entry{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--paper-line);gap:10px;
  }
  .entry:last-child{border-bottom:none;}
  .entry .meta{font-size:.78rem;color:var(--ink-soft);}
  .entry .cat{font-weight:600;}
  .entry .amt.take{color:var(--teal);font-weight:700;}
  .entry .amt.give{color:var(--rust);font-weight:700;}
  .badge{font-size:.7rem;padding:2px 8px;border-radius:10px;white-space:nowrap;}
  .badge.synced{background:#E4F1EC;color:var(--teal);}
  .badge.pending{background:#FBEFE0;color:#8a6d1f;}
  .empty{color:var(--ink-soft);font-size:.85rem;text-align:center;padding:14px 0;}

  #toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;
    font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;
  }
  #toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <h1>লেনদেন খাতা</h1>
  <p>অফলাইন-ফার্স্ট হিসাব এন্ট্রি — নেট পেলে অটো সিঙ্ক হবে</p>
  <div id="status-bar">
    <span id="netPill" class="pill offline">অফলাইন</span>
    <span id="pendingPill" class="pill pending" style="display:none;">0 পেন্ডিং</span>
    <button type="button" id="refreshBtn" class="pill refresh">↻ রিফ্রেশ</button>
  </div>
  <div id="balanceBar">ক্লোজিং ব্যালেন্স: <b id="balanceVal">৳ ০</b></div>
</header>

<main>
  <form class="card" id="entryForm">
    <h2>নতুন এন্ট্রি</h2>

    <label class="req">ক্যাটাগরি</label>
    <select id="category" required></select>

    <label id="phoneLabel">ফোন নম্বর</label>
    <input type="tel" id="phone" placeholder="01XXXXXXXXX" inputmode="numeric">
    <div class="hint" id="phoneHint"></div>

    <label class="req" id="nameLabel">নাম</label>
    <select id="nameSelect" style="display:none;"></select>
    <input type="text" id="name" required placeholder="নাম লিখুন">
    <div class="hint" id="nameHint"></div>

    <div class="row2">
      <div>
        <label>Take Amount (নেওয়া)</label>
        <input type="number" id="takeAmount" min="0" placeholder="৳ 0">
      </div>
      <div>
        <label>Give Amount (দেওয়া)</label>
        <input type="number" id="giveAmount" min="0" placeholder="৳ 0">
      </div>
    </div>

    <label>কারণ / বিবরণ</label>
    <textarea id="reason" rows="2" placeholder="সংক্ষেপে লিখুন"></textarea>

    <div class="sms-box" id="smsBox" style="display:none;">
      <input type="checkbox" id="sendSms">
      <label for="sendSms">সাবমিটের পর SMS App খুলে মেসেজ পাঠানোর সুযোগ দাও (ট্যাপ করে Send করতে হবে)</label>
    </div>

    <button type="submit" class="submit">সংরক্ষণ করুন</button>
  </form>

  <div class="card entries">
    <h2>সাম্প্রতিক এন্ট্রি</h2>
    <div class="filter-box">
      <div class="row2">
        <div>
          <label for="fromDate">শুরুর তারিখ</label>
          <input type="date" id="fromDate">
        </div>
        <div>
          <label for="toDate">শেষ তারিখ</label>
          <input type="date" id="toDate">
        </div>
      </div>
      <div class="filter-actions">
        <span class="filter-summary" id="filterSummary"></span>
        <button type="button" class="clear-filter" id="clearFilter" style="display:none;">ফিল্টার মুছুন</button>
      </div>
    </div>
    <div id="entryList"></div>
  </div>
</main>

<div id="voiceBubble"></div>
<button type="button" id="voiceFab" aria-label="ভয়েস এন্ট্রি">🎤</button>
<div id="toast"></div>

<script>
/* ================== কনফিগ ================== */
// এখানে আপনার Deploy করা Apps Script Web App URL বসান
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZnIeZvuDSMK1JLPseCacLXDv7cpsm4pfjBsElm9SwBecj0oipx8O3aHS1PeA_FQvZ/exec';
const SENDER_NAME = 'সোহেল রানা';

const CATEGORIES = [
  ['Food','খাবার'], ['Gifts','উপহার'], ['Health/Medical','স্বাস্থ্য/চিকিৎসা'],
  ['Transportation','যাতায়াত'], ['Personal','ব্যক্তিগত'],
  ['Giving Loan','ঋণ দেওয়া'], ['Taking Loan','ঋণ নেওয়া'],
  ['Loan Repaid','ঋণ ফেরত পাওয়া'], ['Loan Paid','ঋণ পরিশোধ'],
  ['Credit Purchase','বাকিতে ক্রয়'], ['Credit Purchase Loan Paid','বাকি পরিশোধ'],
  ['Net & Electricity Bill','নেট ও বিদ্যুৎ বিল'], ['Travel','ভ্রমণ'],
  ['Donate','দান'], ['Savings','সঞ্চয়'], ['Other','অন্যান্য']
];
const PHONE_REQUIRED = ['Giving Loan','Loan Paid','Taking Loan','Loan Repaid','Credit Purchase','Credit Purchase Loan Paid'];
const SMS_ALLOWED = PHONE_REQUIRED; // একই লিস্ট

// নামের ড্রপডাউনে কাদের দেখাবে:
// 'iOwe'    = যাদের কাছে আমি ঋণী (তারা আমার কাছে টাকা পাবে)
// 'theyOwe' = যারা আমার কাছে ঋণী
// দুটোতেই "আমার কাছে যারা টাকা পাবে" চাইলে 'Loan Repaid' এর মান 'iOwe' করে দিন।
const PERSON_PICK = { 'Loan Paid': 'iOwe', 'Loan Repaid': 'theyOwe' };
let entriesCache = [];

const SMS_TEMPLATES = {
  'Taking Loan': (name, amt) => `ধন্যবাদ, ${name}।\nআপনাকে জানানো যাচ্ছে যে, ${SENDER_NAME} আপনার কাছ থেকে ${amt} টাকা ঋণ গ্রহণ করেছেন।\nইনশাআল্লাহ নির্ধারিত সময়ের মধ্যে আপনি সম্পূর্ণ টাকা ফেরত পাবেন।\nআপনার সহযোগিতার জন্য আন্তরিক ধন্যবাদ।`,
  'Loan Paid': (name, amt) => `ধন্যবাদ, ${name}।\nআপনাকে জানানো যাচ্ছে যে, ${SENDER_NAME} আপনার কাছ থেকে নেওয়া ${amt} টাকা ঋণ পরিশোধ করেছেন।\nইনশাআল্লাহ ভবিষ্যতেও আপনার সাথে এই সুন্দর সম্পর্ক বজায় থাকবে।\nআপনার সহযোগিতা ও বিশ্বাসের জন্য আন্তরিক ধন্যবাদ।`,
  'Giving Loan': (name, amt) => `ধন্যবাদ, ${name}।\nআপনাকে জানানো যাচ্ছে যে, আপনি ${SENDER_NAME} এর কাছ থেকে ${amt} টাকা নিয়েছেন।\nইনশাআল্লাহ আমাদের লেনদেন সুষ্ঠ এবং সুন্দর হবে।\nআপনার সহযোগিতা ও বিশ্বাসের জন্য আন্তরিক ধন্যবাদ।`,
  'Loan Repaid': (name, amt) => `ধন্যবাদ, ${name}।\nআপনাকে জানানো যাচ্ছে যে, আপনি ${SENDER_NAME} এর কাছ থেকে নেওয়া ${amt} টাকা পরিশোধ করেছেন।\nইনশাআল্লাহ আমাদের লেনদেন সুষ্ঠ এবং সুন্দর হবে।\nআপনার সহযোগিতা ও বিশ্বাসের জন্য আন্তরিক ধন্যবাদ।`,
  'Credit Purchase': (name, amt) => `ধন্যবাদ, ${name}।\nআপনাকে জানানো যাচ্ছে যে, ${SENDER_NAME} আপনার কাছ থেকে বাকিতে ক্রয় করেছেন, যার মোট মূল্য ${amt} টাকা।\nইনশাআল্লাহ নির্ধারিত সময়ের মধ্যে সম্পূর্ণ টাকা পরিশোধ করা হবে।\nআপনার সহযোগিতা ও বিশ্বাসের জন্য আন্তরিক ধন্যবাদ।`,
  'Credit Purchase Loan Paid': (name, amt) => `ধন্যবাদ, ${name}।\nআপনাকে জানানো যাচ্ছে যে, ${SENDER_NAME} আপনার কাছ থেকে বাকিতে ক্রয় করা পণ্যের জন্য বকেয়া ${amt} টাকা পরিশোধ করেছেন।\nইনশাআল্লাহ ভবিষ্যতেও আমাদের এই সুন্দর লেনদেন সম্পর্ক বজায় থাকবে।\nআপনার সহযোগিতা ও বিশ্বাসের জন্য আন্তরিক ধন্যবাদ।`
};

/* ================== IndexedDB ================== */
let db;
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('ledgerDB', 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if(!d.objectStoreNames.contains('entries')){
        const store = d.createObjectStore('entries', {keyPath:'id', autoIncrement:true});
        store.createIndex('synced', 'synced');
      }
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}
function txStore(mode='readonly'){
  return db.transaction('entries', mode).objectStore('entries');
}
function addEntry(entry){
  return new Promise((res, rej) => {
    const r = txStore('readwrite').add(entry);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function getAllEntries(){
  return new Promise((res, rej) => {
    const r = txStore().getAll();
    r.onsuccess = () => res(r.result.sort((a, b) => (Date.parse(b.dateTime) || 0) - (Date.parse(a.dateTime) || 0)));
    r.onerror = () => rej(r.error);
  });
}
function markSynced(id){
  return new Promise((res, rej) => {
    const store = txStore('readwrite');
    const g = store.get(id);
    g.onsuccess = () => {
      const val = g.result;
      if(!val) return res();
      val.synced = true;
      const p = store.put(val);
      p.onsuccess = () => res();
      p.onerror = () => rej(p.error);
    };
    g.onerror = () => rej(g.error);
  });
}

// Sheet থেকে আনা তালিকা দিয়ে সিঙ্কড এন্ট্রি বদলে ফেলে (পেন্ডিং এন্ট্রি অক্ষত থাকে)
function replaceSynced(rows){
  return new Promise((res, rej) => {
    const tx = db.transaction('entries', 'readwrite');
    const store = tx.objectStore('entries');
    const req = store.getAll();
    req.onsuccess = () => {
      req.result.forEach(e => { if(e.synced) store.delete(e.id); });
      rows.forEach(r => store.add({
        dateTime: r.dateTime || new Date(0).toISOString(),
        category: r.category || '',
        name: r.name || '',
        phone: r.phone || '',
        takeAmount: r.takeAmount === '' || r.takeAmount == null ? '' : String(r.takeAmount),
        giveAmount: r.giveAmount === '' || r.giveAmount == null ? '' : String(r.giveAmount),
        reason: r.reason || '',
        synced: true,
        fromSheet: true
      }));
    };
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
}

/* ================== UI Init ================== */
const $ = (id) => document.getElementById(id);
const categorySel = $('category');
CATEGORIES.forEach(([val, label]) => {
  const o = document.createElement('option');
  o.value = val; o.textContent = `${label} (${val})`;
  categorySel.appendChild(o);
});

function updateCategoryUI(){
  const cat = categorySel.value;
  const needsPhone = PHONE_REQUIRED.includes(cat);
  $('phone').required = needsPhone;
  $('phoneLabel').className = needsPhone ? 'req' : '';
  $('smsBox').style.display = SMS_ALLOWED.includes(cat) ? 'flex' : 'none';
  if(!SMS_ALLOWED.includes(cat)) $('sendSms').checked = false;
  refreshNameSelect();
}
categorySel.addEventListener('change', updateCategoryUI);
updateCategoryUI();

/* ফোন নম্বর দিয়ে Name অটো-ফিল */
let phoneTimer;
$('phone').addEventListener('input', () => {
  clearTimeout(phoneTimer);
  const phone = $('phone').value.trim();
  $('phoneHint').textContent = '';
  $('phoneHint').className = 'hint';
  if(phone.length < 6 || !navigator.onLine || APPS_SCRIPT_URL.includes('PASTE_')) return;
  phoneTimer = setTimeout(async () => {
    try{
      $('phoneHint').textContent = 'চেক করা হচ্ছে...';
      const res = await fetch(`${APPS_SCRIPT_URL}?action=checkPhone&phone=${encodeURIComponent(phone)}`);
      const data = await res.json();
      if(data.found){
        $('name').value = data.name;
        $('phoneHint').textContent = `✓ পূর্ব পরিচিত নাম্বার: ${data.name}`;
        $('phoneHint').className = 'hint found';
      } else {
        $('phoneHint').textContent = 'নতুন নম্বর — নাম লিখুন';
      }
    }catch(err){
      $('phoneHint').textContent = '';
    }
  }, 500);
});

/* ================== Submit ================== */
$('entryForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const cat = categorySel.value;
  const name = getNameValue();
  const phone = $('phone').value.trim();
  const takeAmount = $('takeAmount').value || '';
  const giveAmount = $('giveAmount').value || '';
  const reason = $('reason').value.trim();
  const wantSms = $('sendSms').checked;

  if(PHONE_REQUIRED.includes(cat) && !phone){
    toast('এই ক্যাটাগরিতে ফোন নম্বর আবশ্যক');
    return;
  }

  const entry = {
    dateTime: new Date().toISOString(),
    category: cat, name, phone, takeAmount, giveAmount, reason,
    synced: false
  };
  const id = await addEntry(entry);
  await renderEntries();
  toast('সংরক্ষণ হয়েছে ✓');

  const smsUrl = (wantSms && SMS_ALLOWED.includes(cat) && phone)
    ? buildSmsLink(cat, name, phone, takeAmount, giveAmount) : null;

  $('entryForm').reset();
  updateCategoryUI();

  if(navigator.onLine) syncAll();

  // SMS App খোলা (ইউজারকে ট্যাপ করে Send করতে হবে)
  if(smsUrl) setTimeout(() => { window.location.href = smsUrl; }, 300);
});

function buildSmsLink(cat, name, phone, takeAmount, giveAmount){
  const amt = takeAmount || giveAmount || '0';
  const template = SMS_TEMPLATES[cat];
  if(!template) return null;
  const msg = template(name, amt);
  return `sms:${phone}?body=${encodeURIComponent(msg)}`;
}

/* ================== Sync ================== */
// syncAll ও pull একসাথে না চলার জন্য সিরিয়াল লক
let lockChain = Promise.resolve();
function withLock(fn){
  const p = lockChain.then(fn, fn);
  lockChain = p.catch(() => {});
  return p;
}
function syncAll(){ return withLock(_syncAll); }
function pullFromSheet(){ return withLock(_pullFromSheet); }
async function syncAndPull(){
  await syncAll();
  await pullFromSheet();
}

let lastPull = 0;
async function _pullFromSheet(){
  if(!navigator.onLine || APPS_SCRIPT_URL.includes('PASTE_')) return false;
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=getEntries`);
    const data = await res.json();
    if(!data || !data.success || !Array.isArray(data.entries)) return false;
    await replaceSynced(data.entries);
    lastPull = Date.now();
    await renderEntries();
    return true;
  }catch(err){
    return false;
  }
}

async function _syncAll(){
  const all = await getAllEntries();
  const pending = all.filter(x => !x.synced);
  updatePendingPill(pending.length);
  if(APPS_SCRIPT_URL.includes('PASTE_')) return; // এখনো কনফিগার করা হয়নি

  for(const entry of pending){
    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'}, // preflight এড়াতে
        body: JSON.stringify({ action: 'submitForm', ...entry })
      });
      const data = await res.json();
      if(data && data.success){
        await markSynced(entry.id);
      }
    }catch(err){
      break; // নেট সমস্যা হলে থামিয়ে দাও, পরে আবার চেষ্টা হবে
    }
  }
  await renderEntries();
}

/* ================== ব্যালেন্স ও ব্যক্তি-তালিকা ================== */
const amtOf = (e) => Number(e.takeAmount || e.giveAmount || 0) || 0;
const bn = (n) => Number(n).toLocaleString('bn-BD');
const fromDate = $('fromDate'), toDate = $('toDate');

function updateBalance(all){
  let bal = 0;
  all.forEach(e => { bal += (Number(e.takeAmount) || 0) - (Number(e.giveAmount) || 0); });
  const el = $('balanceVal');
  el.textContent = (bal < 0 ? '-' : '') + '৳ ' + bn(Math.abs(bal));
  el.className = bal < 0 ? 'neg' : '';
}

function computePeople(all, mode){
  const plus  = mode === 'iOwe' ? 'Taking Loan' : 'Giving Loan';
  const minus = mode === 'iOwe' ? 'Loan Paid'   : 'Loan Repaid';
  const map = {};
  all.slice().reverse().forEach(e => { // পুরনো থেকে নতুন
    if(e.category !== plus && e.category !== minus) return;
    const key = e.phone || e.name;
    if(!key) return;
    const p = map[key] || (map[key] = {name: e.name, phone: e.phone || '', bal: 0});
    if(e.name) p.name = e.name;
    if(e.phone) p.phone = e.phone;
    p.bal += (e.category === plus ? 1 : -1) * amtOf(e);
  });
  return Object.values(map).filter(p => p.bal > 0).sort((a, b) => b.bal - a.bal);
}

function applyNameMode(){
  const mode = PERSON_PICK[categorySel.value];
  const sel = $('nameSelect'), input = $('name');
  if(!mode){
    sel.style.display = 'none'; sel.required = false;
    input.style.display = ''; input.required = true;
    return;
  }
  sel.style.display = ''; sel.required = true;
  const other = sel.value === '__other__';
  input.style.display = other ? '' : 'none';
  input.required = other;
}

function refreshNameSelect(){
  const mode = PERSON_PICK[categorySel.value];
  const sel = $('nameSelect');
  if(!mode){
    $('nameHint').textContent = '';
    applyNameMode();
    return;
  }
  const people = computePeople(entriesCache, mode);
  const prev = sel.value;
  sel.innerHTML = '';
  sel.add(new Option(people.length ? '— নাম বাছাই করুন —' : 'কোনো বকেয়া নেই', ''));
  people.forEach(p => {
    const o = new Option(`${p.name} — ৳${bn(p.bal)}`, p.name);
    o.dataset.phone = p.phone;
    sel.add(o);
  });
  sel.add(new Option('✎ অন্য নাম লিখুন', '__other__'));
  if([...sel.options].some(o => o.value === prev)) sel.value = prev;
  $('nameHint').textContent = mode === 'iOwe'
    ? 'যাদের কাছে আপনি ঋণী (তারা আপনার কাছে টাকা পাবে)'
    : 'যারা আপনার কাছে ঋণী';
  $('nameHint').className = 'hint';
  applyNameMode();
}

$('nameSelect').addEventListener('change', () => {
  const sel = $('nameSelect');
  const opt = sel.options[sel.selectedIndex];
  if(opt && opt.dataset.phone) $('phone').value = opt.dataset.phone;
  applyNameMode();
});

function getNameValue(){
  if(PERSON_PICK[categorySel.value] && $('nameSelect').value !== '__other__'){
    return $('nameSelect').value;
  }
  return $('name').value.trim();
}

function setNameValue(name, phone){
  if(PERSON_PICK[categorySel.value]){
    const sel = $('nameSelect');
    const opt = [...sel.options].find(o => o.value === name);
    if(opt){
      sel.value = name;
      if(!phone) phone = opt.dataset.phone || '';
    } else {
      sel.value = '__other__';
      $('name').value = name;
    }
    applyNameMode();
  } else {
    $('name').value = name;
  }
  $('phone').value = phone || '';
}

/* ================== তারিখ ফিল্টার ================== */
function ymd(iso){
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
[fromDate, toDate].forEach(el => el.addEventListener('change', renderEntries));
$('clearFilter').addEventListener('click', () => {
  fromDate.value = ''; toDate.value = '';
  renderEntries();
});

/* ================== রেন্ডার ================== */
async function renderEntries(){
  const all = await getAllEntries();
  entriesCache = all;
  updatePendingPill(all.filter(x => !x.synced).length);
  updateBalance(all);
  refreshNameSelect();

  let from = fromDate.value, to = toDate.value;
  if(from && to && from > to){ const t = from; from = to; to = t; }
  const filtering = !!(from || to);
  $('clearFilter').style.display = filtering ? '' : 'none';

  let rows = all;
  if(filtering){
    rows = all.filter(e => {
      const d = ymd(e.dateTime);
      return (!from || d >= from) && (!to || d <= to);
    });
    const tk = rows.reduce((s, e) => s + (Number(e.takeAmount) || 0), 0);
    const gv = rows.reduce((s, e) => s + (Number(e.giveAmount) || 0), 0);
    $('filterSummary').textContent = `${bn(rows.length)}টি এন্ট্রি | নেওয়া ৳${bn(tk)} | দেওয়া ৳${bn(gv)}`;
  } else {
    $('filterSummary').textContent = '';
  }

  const list = $('entryList');
  if(all.length === 0){
    list.innerHTML = '<div class="empty">এখনো কোনো এন্ট্রি নেই</div>';
    return;
  }
  if(rows.length === 0){
    list.innerHTML = '<div class="empty">এই সময়ে কোনো এন্ট্রি নেই</div>';
    return;
  }
  list.innerHTML = (filtering ? rows : rows.slice(0, 30)).map(e => {
    const amt = e.takeAmount ? `<span class="amt take">+৳${e.takeAmount}</span>` :
                e.giveAmount ? `<span class="amt give">-৳${e.giveAmount}</span>` : '';
    const dt = new Date(e.dateTime);
    const dtStr = dt.toLocaleDateString('bn-BD') + ' ' + dt.toLocaleTimeString('bn-BD', {hour:'2-digit', minute:'2-digit'});
    return `<div class="entry">
      <div>
        <div class="cat">${e.category}${e.name ? ' — ' + e.name : ''}</div>
        <div class="meta">${dtStr}</div>
      </div>
      <div style="text-align:right;">
        ${amt}<br>
        <span class="badge ${e.synced ? 'synced' : 'pending'}">${e.synced ? '✓ সিঙ্কড' : '⏳ পেন্ডিং'}</span>
      </div>
    </div>`;
  }).join('');
}

/* ================== ভয়েস এন্ট্রি ================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const fab = $('voiceFab'), bubble = $('voiceBubble');
let recog = null, listening = false;

function showBubble(t){ bubble.textContent = t; bubble.classList.add('show'); }
function hideBubble(){ bubble.classList.remove('show'); }

const bnToEn = (s) => s.replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));

const MUL = {'হাজার':1000,'লাখ':100000,'লক্ষ':100000,'শত':100,'শো':100,'শ':100};
const NUM_WORDS = {'দেড়':1.5,'আড়াই':2.5,'এক':1,'দুই':2,'তিন':3,'চার':4,'পাঁচ':5,'ছয়':6,'সাত':7,'আট':8,'নয়':9,'দশ':10,
  'বিশ':20,'ত্রিশ':30,'চল্লিশ':40,'পঞ্চাশ':50,'ষাট':60,'সত্তর':70,'আশি':80,'নব্বই':90};

function parseAmount(text){
  const t = bnToEn(text).replace(/,/g, '');
  const M = 'হাজার|লাখ|লক্ষ|শত|শো|শ';
  let m = t.match(new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(${M})?\\s*টাকা`)) ||
          t.match(new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(${M})?(?=\\s|$)`));
  if(m) return Math.round(parseFloat(m[1]) * (MUL[m[2]] || 1));
  const keys = Object.keys(NUM_WORDS).join('|');
  m = t.match(new RegExp(`(${keys})\\s*(${M})`));
  if(m) return Math.round(NUM_WORDS[m[1]] * MUL[m[2]]);
  m = t.match(new RegExp(`(${keys})\\s*টাকা`));
  if(m) return Math.round(NUM_WORDS[m[1]]);
  return 0;
}

function detectCategory(t){
  const has = (...w) => w.some(x => t.includes(x));
  if(has('বাকি', 'বাকী')){
    if(has('পরিশোধ', 'শোধ', 'দিয়েছি', 'দিলাম', 'মিটিয়ে')) return ['Credit Purchase Loan Paid', 'give'];
    return ['Credit Purchase', 'take'];
  }
  if(has('লোন', 'ঋণ', 'ধার', 'কর্জ', 'ফেরত')){
    if(has('ফেরত দিয়েছে', 'ফেরত দিল', 'ফেরত পেয়েছি', 'ফেরত পেলাম', 'পরিশোধ করেছে', 'পরিশোধ করল', 'শোধ করেছে', 'শোধ করল', 'ফেরত এসেছে'))
      return ['Loan Repaid', 'take'];
    if(has('ফেরত দিয়েছি', 'ফেরত দিলাম', 'পরিশোধ', 'শোধ'))
      return ['Loan Paid', 'give'];
    if(has('নিয়েছি', 'নিলাম', 'নিয়েছিলাম', 'পেয়েছি', 'পেলাম'))
      return ['Taking Loan', 'take'];
    if(has('দিয়েছি', 'দিলাম', 'দিয়েছিলাম', 'দেওয়া'))
      return ['Giving Loan', 'give'];
  }
  if(has('বিল', 'নেট', 'ইন্টারনেট', 'বিদ্যুৎ', 'কারেন্ট')) return ['Net & Electricity Bill', 'give'];
  if(has('ঔষধ', 'ওষুধ', 'ডাক্তার', 'চিকিৎসা', 'হাসপাতাল')) return ['Health/Medical', 'give'];
  if(has('দান', 'সদকা', 'যাকাত')) return ['Donate', 'give'];
  if(has('সঞ্চয়', 'জমা')) return ['Savings', 'give'];
  if(has('উপহার', 'গিফট')) return ['Gifts', 'give'];
  if(has('ভ্রমণ', 'ঘুরতে')) return ['Travel', 'give'];
  if(has('যাতায়াত', 'ভাড়া', 'রিকশা', 'বাস', 'সিএনজি', 'উবার', 'পাঠাও')) return ['Transportation', 'give'];
  if(has('খাবার', 'খাওয়া', 'বাজার', 'নাস্তা', 'চা ', 'রেস্টুরেন্ট')) return ['Food', 'give'];
  if(has('ব্যক্তিগত')) return ['Personal', 'give'];
  if(has('বেতন', 'ইনকাম')) return ['Other', 'take'];
  return ['Other', 'give'];
}

function knownPeople(){
  const seen = new Map();
  entriesCache.forEach(e => { // নতুন আগে
    if(!e.name) return;
    const p = seen.get(e.name);
    if(!p) seen.set(e.name, {name: e.name, phone: e.phone || ''});
    else if(!p.phone && e.phone) p.phone = e.phone;
  });
  return [...seen.values()];
}

function extractPerson(text){
  const known = knownPeople().filter(p => p.name.length >= 2).sort((a, b) => b.name.length - a.name.length);
  const hit = known.find(p => text.includes(p.name));
  if(hit) return hit;

  let m = text.match(/^(.+?)(?:\s*(?:এর|ের))?\s+(?:কাছ\s*থেকে|কাছে|থেকে)/) ||
          text.match(/^(.+?)\s*কে\s/);
  if(!m) return null;
  const name = m[1].replace(/^(আমি|আজ|গতকাল|আমার)\s+/, '').trim();
  if(!name || /\d|টাকা/.test(bnToEn(name))) return null;
  return {name, phone: ''};
}

function applyVoiceEntry(text){
  const [cat, field] = detectCategory(text);
  const amount = parseAmount(text);
  const person = extractPerson(text);

  categorySel.value = cat;
  updateCategoryUI();
  $('takeAmount').value = (field === 'take' && amount) ? amount : '';
  $('giveAmount').value = (field === 'give' && amount) ? amount : '';
  $('reason').value = text;
  if(person) setNameValue(person.name, person.phone);
  else { $('phone').value = ''; if(!PERSON_PICK[cat]) $('name').value = ''; }

  $('entryForm').scrollIntoView({behavior: 'smooth', block: 'start'});
  toast('ভয়েস থেকে ফর্ম পূরণ হয়েছে — যাচাই করে সংরক্ষণ করুন');
}

fab.addEventListener('click', () => {
  if(!SR){ toast('এই ব্রাউজারে ভয়েস সাপোর্ট নেই (Chrome ব্যবহার করুন)'); return; }
  if(listening){ recog.stop(); return; }
  if(!navigator.onLine){ toast('ভয়েসের জন্য ইন্টারনেট লাগবে'); return; }

  recog = new SR();
  recog.lang = 'bn-BD';
  recog.interimResults = true;
  recog.continuous = false;
  let finalText = '';

  recog.onstart = () => { listening = true; fab.classList.add('listening'); showBubble('শুনছি… বলুন'); };
  recog.onresult = (ev) => {
    let interim = '';
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const t = ev.results[i][0].transcript;
      if(ev.results[i].isFinal) finalText += t; else interim += t;
    }
    showBubble((finalText + interim) || 'শুনছি…');
  };
  recog.onerror = (ev) => {
    if(ev.error === 'not-allowed' || ev.error === 'service-not-allowed') toast('মাইক্রোফোনের অনুমতি দিন');
    else if(ev.error === 'no-speech') toast('কিছু শোনা যায়নি, আবার চেষ্টা করুন');
    else toast('ভয়েস ত্রুটি: ' + ev.error);
  };
  recog.onend = () => {
    listening = false;
    fab.classList.remove('listening');
    const text = finalText.trim();
    if(text){
      showBubble('“' + text + '”');
      applyVoiceEntry(text);
      setTimeout(hideBubble, 2500);
    } else hideBubble();
  };
  try{ recog.start(); }catch(e){ toast('ভয়েস শুরু করা যায়নি'); }
});

/* ================== স্ট্যাটাস বার ================== */
function updateNetPill(){
  const pill = $('netPill');
  if(navigator.onLine){
    pill.textContent = 'অনলাইন'; pill.className = 'pill online';
  } else {
    pill.textContent = 'অফলাইন'; pill.className = 'pill offline';
  }
}
function updatePendingPill(count){
  const pill = $('pendingPill');
  if(count > 0){
    pill.style.display = 'inline-block';
    pill.textContent = `${count} পেন্ডিং`;
  } else {
    pill.style.display = 'none';
  }
}
window.addEventListener('online', () => { updateNetPill(); syncAndPull(); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && navigator.onLine && Date.now() - lastPull > 60000) syncAndPull();
});
$('refreshBtn').addEventListener('click', async () => {
  if(!navigator.onLine){ toast('ইন্টারনেট নেই'); return; }
  toast('আপডেট হচ্ছে…');
  await syncAll();
  const ok = await pullFromSheet();
  toast(ok ? 'Sheet থেকে আপডেট হয়েছে ✓' : 'আপডেট করা যায়নি, পরে চেষ্টা করুন');
});
window.addEventListener('offline', updateNetPill);

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ================== Init ================== */
(async function init(){
  await openDB();
  updateNetPill();
  await renderEntries();
  if(navigator.onLine) syncAndPull();
  setInterval(() => { if(navigator.onLine) syncAll(); }, 30000);

  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('./service-worker.js'); }catch(e){}
  }
})();
</script>
